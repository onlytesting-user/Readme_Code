name: Update GitHub Stats

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Stats Cards ---
      - name: Generate Dark Stats
        uses: soulteary/github-readme-stats-action@main
        with:
          card: stats
          path: profile/stats-dark.svg
          options: 'username=${{ github.repository_owner }}&show_icons=true&bg_color=000&border_color=fff&text_color=c0c0c0&title_color=e38c00'

      - name: Generate Light Stats
        uses: soulteary/github-readme-stats-action@main
        with:
          card: stats
          path: profile/stats-light.svg
          options: 'username=${{ github.repository_owner }}&show_icons=true&bg_color=fff&border_color=d0d7de&text_color=24292f&title_color=0969da'

      # --- Language Cards ---
      - name: Generate Dark Langs
        uses: soulteary/github-readme-stats-action@main
        with:
          card: top-langs
          path: profile/langs-dark.svg
          options: 'username=${{ github.repository_owner }}&layout=compact&langs_count=8&bg_color=000&border_color=fff&text_color=c0c0c0&title_color=e38c00&hide=html,css,java,javascript,typescript'

      - name: Generate Light Langs
        uses: soulteary/github-readme-stats-action@main
        with:
          card: top-langs
          path: profile/langs-light.svg
          # Using standard GitHub light colors for the light version
          options: 'username=${{ github.repository_owner }}&layout=compact&langs_count=8&bg_color=fff&border_color=d0d7de&text_color=24292f&title_color=0969da&hide=html,css,java,javascript,typescript'

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p profile
          git add profile/*.svg
          git commit -m "docs: update profile stats [skip ci]" || exit 0
          git push
