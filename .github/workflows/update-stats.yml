name: Update GitHub Stats
on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight
  workflow_dispatch: # Allows you to run it manually

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Stats SVG
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: stats
          # Custom colors: Purple titles, White text, Black background
          options: 'username=${{ github.repository_owner }}&hide_border=true&show_icons=true&include_all_commits=true&count_private=true&title_color=7B42BC&bg_color=000&text_color=fff&border_radius=3&rank_icon=github'
          path: profile/stats.svg
          token: ${{ secrets.GH_TOKEN }}

      - name: Generate Top Langs SVG
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: top-langs
          # Hiding: html, css, java, javascript, typescript
          options: 'username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide_border=true&title_color=7B42BC&bg_color=000&text_color=fff&border_radius=3&hide=html,css,java,javascript,typescript'
          path: profile/langs.svg
          token: ${{ secrets.GH_TOKEN }}

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p profile # Ensures the folder exists
          git add profile/*.svg
          git commit -m "docs: update profile stats [skip ci]" || exit 0
          git push
